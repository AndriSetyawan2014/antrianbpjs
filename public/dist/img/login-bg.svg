<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Ilustrasi rumah sakit Queen Latifa">
  <!-- Aksen lingkaran cerah di latar -->
  <circle cx="680" cy="110" r="190" fill="#2296b0" opacity="0.35"/>
  <circle cx="680" cy="110" r="130" fill="#38b2cc" opacity="0.22"/>
  <circle cx="110" cy="220" r="140" fill="#1b88a0" opacity="0.28"/>

  <!-- Bukit / latar bawah berlapis cerah -->
  <path d="M0 370 Q210 330 430 355 T800 345 L800 520 L0 520 Z" fill="#0d5f73" opacity="0.65"/>
  <path d="M0 415 Q260 385 520 405 T800 390 L800 520 L0 520 Z" fill="#0a4f61" opacity="0.85"/>

  <!-- Garis detak jantung (ECG) cerah -->
  <path d="M0 250 H170 L192 250 L208 202 L228 296 L246 232 L260 250 H430 L448 250 L462 214 L480 284 L496 250 H640 L656 226 L672 268 L686 250 H800"
        fill="none" stroke="#7ce0f4" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ilustrasi Gedung Rumah Sakit Utama (tengah-kiri) -->
  <g stroke="#a8eefc" stroke-opacity="0.7" stroke-width="2" fill="#0f677c" fill-opacity="0.75" stroke-linejoin="round">
    <!-- Gedung sayap kiri -->
    <rect x="56" y="330" width="120" height="150" rx="4"/>
    <!-- Gedung utama tengah -->
    <rect x="176" y="276" width="188" height="204" rx="5"/>
    <!-- Atap / menara palang medis -->
    <rect x="232" y="236" width="76" height="40" rx="4"/>
    <!-- Gedung sayap kanan -->
    <rect x="364" y="316" width="136" height="164" rx="4"/>
    <!-- Gedung klinik kanan -->
    <rect x="540" y="344" width="190" height="136" rx="4"/>
    <rect x="595" y="312" width="80" height="32" rx="3"/>
  </g>

  <!-- Jendela-jendela menyala (kuning hangat & sian cerah) -->
  <g rx="2">
    <!-- Jendela gedung utama -->
    <rect x="200" y="302" width="24" height="18" rx="2" fill="#ffd166" fill-opacity="0.85"/>
    <rect x="238" y="302" width="24" height="18" rx="2" fill="#8ce9f9" fill-opacity="0.65"/>
    <rect x="276" y="302" width="24" height="18" rx="2" fill="#ffd166" fill-opacity="0.85"/>
    <rect x="314" y="302" width="24" height="18" rx="2" fill="#8ce9f9" fill-opacity="0.65"/>

    <rect x="200" y="334" width="24" height="18" rx="2" fill="#8ce9f9" fill-opacity="0.65"/>
    <rect x="238" y="334" width="24" height="18" rx="2" fill="#ffd166" fill-opacity="0.85"/>
    <rect x="276" y="334" width="24" height="18" rx="2" fill="#8ce9f9" fill-opacity="0.65"/>
    <rect x="314" y="334" width="24" height="18" rx="2" fill="#ffd166" fill-opacity="0.85"/>

    <rect x="200" y="366" width="24" height="18" rx="2" fill="#ffd166" fill-opacity="0.8"/>
    <rect x="238" y="366" width="24" height="18" rx="2" fill="#8ce9f9" fill-opacity="0.65"/>
    <rect x="276" y="366" width="24" height="18" rx="2" fill="#ffd166" fill-opacity="0.85"/>
    <rect x="314" y="366" width="24" height="18" rx="2" fill="#8ce9f9" fill-opacity="0.65"/>

    <!-- Jendela sayap kiri -->
    <rect x="78" y="354" width="22" height="16" rx="2" fill="#8ce9f9" fill-opacity="0.6"/>
    <rect x="112" y="354" width="22" height="16" rx="2" fill="#ffd166" fill-opacity="0.8"/>
    <rect x="78" y="384" width="22" height="16" rx="2" fill="#ffd166" fill-opacity="0.8"/>
    <rect x="112" y="384" width="22" height="16" rx="2" fill="#8ce9f9" fill-opacity="0.6"/>
    <rect x="78" y="414" width="22" height="16" rx="2" fill="#8ce9f9" fill-opacity="0.6"/>
    <rect x="112" y="414" width="22" height="16" rx="2" fill="#8ce9f9" fill-opacity="0.6"/>

    <!-- Jendela sayap kanan -->
    <rect x="386" y="342" width="22" height="16" rx="2" fill="#8ce9f9" fill-opacity="0.6"/>
    <rect x="420" y="342" width="22" height="16" rx="2" fill="#ffd166" fill-opacity="0.85"/>
    <rect x="454" y="342" width="22" height="16" rx="2" fill="#8ce9f9" fill-opacity="0.6"/>
    <rect x="386" y="372" width="22" height="16" rx="2" fill="#ffd166" fill-opacity="0.8"/>
    <rect x="420" y="372" width="22" height="16" rx="2" fill="#8ce9f9" fill-opacity="0.6"/>
    <rect x="454" y="372" width="22" height="16" rx="2" fill="#ffd166" fill-opacity="0.8"/>
    <rect x="386" y="402" width="22" height="16" rx="2" fill="#8ce9f9" fill-opacity="0.6"/>
    <rect x="420" y="402" width="22" height="16" rx="2" fill="#8ce9f9" fill-opacity="0.6"/>
    <rect x="454" y="402" width="22" height="16" rx="2" fill="#8ce9f9" fill-opacity="0.6"/>

    <!-- Jendela gedung kanan -->
    <rect x="566" y="368" width="26" height="16" rx="2" fill="#ffd166" fill-opacity="0.8"/>
    <rect x="606" y="368" width="26" height="16" rx="2" fill="#8ce9f9" fill-opacity="0.6"/>
    <rect x="646" y="368" width="26" height="16" rx="2" fill="#ffd166" fill-opacity="0.8"/>
    <rect x="686" y="368" width="26" height="16" rx="2" fill="#8ce9f9" fill-opacity="0.6"/>
    <rect x="566" y="398" width="26" height="16" rx="2" fill="#8ce9f9" fill-opacity="0.6"/>
    <rect x="606" y="398" width="26" height="16" rx="2" fill="#ffd166" fill-opacity="0.85"/>
    <rect x="646" y="398" width="26" height="16" rx="2" fill="#8ce9f9" fill-opacity="0.6"/>
    <rect x="686" y="398" width="26" height="16" rx="2" fill="#ffd166" fill-opacity="0.8"/>
  </g>

  <!-- Pintu masuk utama (kubah hangat) -->
  <path d="M242 480 V432 A28 28 0 0 1 298 432 V480 Z" fill="#ffd166" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- Palang medis oranye-emas khas Queen Latifa -->
  <g fill="#f9a826">
    <rect x="263" y="242" width="14" height="30" rx="2"/>
    <rect x="255" y="250" width="30" height="14" rx="2"/>
    <rect x="629" y="317" width="12" height="24" rx="2"/>
    <rect x="623" y="323" width="24" height="12" rx="2"/>
  </g>

  <!-- Garis tanah -->
  <line x1="20" y1="480" x2="780" y2="480" stroke="#8ce9f9" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Ornamen plus medis kecil -->
  <g stroke="#b6f2fd" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round">
    <path d="M96 190h12M102 184v12"/>
    <path d="M520 170h14M527 163v14"/>
    <path d="M716 240h12M722 234v12"/>
  </g>
</svg>
