<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustrasi latar rumah sakit">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2e38"/>
      <stop offset="1" stop-color="#0d3641"/>
    </linearGradient>
  </defs>

  <!-- Latar solid -->
  <rect width="1920" height="1080" fill="url(#base)"/>

  <!-- Bentuk geometris datar (tanpa glow) -->
  <circle cx="1700" cy="150" r="520" fill="#103d48" opacity="0.55"/>
  <circle cx="1700" cy="150" r="360" fill="none" stroke="#4f8591" stroke-opacity="0.18" stroke-width="1.5"/>
  <rect x="-120" y="720" width="900" height="420" fill="#0a2933" opacity="0.85"/>

  <!-- Siluet rumah sakit (line art datar) -->
  <g stroke="#78aab4" stroke-opacity="0.38" stroke-width="2" fill="none" stroke-linejoin="round">
    <!-- gedung kiri -->
    <rect x="120" y="700" width="300" height="380"/>
    <rect x="168" y="640" width="96" height="60"/>
    <rect x="300" y="672" width="80" height="28"/>
    <!-- jendela -->
    <g stroke-opacity="0.26" stroke-width="1.5">
      <path d="M150 740h40M210 740h40M270 740h40M330 740h40M387 740h20"/>
      <path d="M150 786h40M210 786h40M270 786h40M330 786h40M387 786h20"/>
      <path d="M150 832h40M210 832h40M270 832h40M330 832h40M387 832h20"/>
      <path d="M150 878h40M210 878h40M270 878h40M330 878h40M387 878h20"/>
      <path d="M150 924h40M210 924h40M270 924h40M330 924h40M387 924h20"/>
      <path d="M150 970h40M210 970h40M270 970h40M330 970h40M387 970h20"/>
    </g>
    <!-- pintu masuk -->
    <path d="M236 1080v-70a34 34 0 0 1 68 0v70"/>

    <!-- gedung kanan -->
    <rect x="1590" y="730" width="330" height="350"/>
    <rect x="1660" y="664" width="120" height="66"/>
    <g stroke-opacity="0.26" stroke-width="1.5">
      <path d="M1625 770h44M1695 770h44M1765 770h44M1835 770h44M1885 770h15"/>
      <path d="M1625 816h44M1695 816h44M1765 816h44M1835 816h44M1885 816h15"/>
      <path d="M1625 862h44M1695 862h44M1765 862h44M1835 862h44M1885 862h15"/>
      <path d="M1625 908h44M1695 908h44M1765 908h44M1835 908h44M1885 908h15"/>
      <path d="M1625 954h44M1695 954h44M1765 954h44M1835 954h44M1885 954h15"/>
    </g>
  </g>

  <!-- Palang medis (satu aksen saja) -->
  <g fill="#d9a24a" fill-opacity="0.75">
    <rect x="206" y="656" width="20" height="48" rx="2"/>
    <rect x="192" y="670" width="48" height="20" rx="2"/>
    <rect x="1703" y="678" width="16" height="38" rx="2"/>
    <rect x="1692" y="689" width="38" height="16" rx="2"/>
  </g>

  <!-- Garis ECG tipis, tanpa efek glow -->
  <path d="M0 690h300l26 0 14-44 18 84 16-40h190l24 0 12-22 14 22h250l22 0 16-52 20 96 18-44h212l22 0 14-18 14 18h300l26 0 14-38 18 70 14-32h180"
        fill="none" stroke="#78aab4" stroke-opacity="0.30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Detail kecil: titik & plus -->
  <g fill="#78aab4" fill-opacity="0.22">
    <circle cx="620" cy="250" r="3"/>
    <circle cx="700" cy="290" r="2.5"/>
    <circle cx="1280" cy="220" r="3"/>
    <circle cx="1340" cy="270" r="2.5"/>
    <circle cx="1000" cy="330" r="2.5"/>
  </g>
  <g fill="none" stroke="#78aab4" stroke-opacity="0.18" stroke-width="1.5">
    <path d="M560 520h16M568 512v16"/>
    <path d="M1250 560h14M1257 553v14"/>
    <path d="M1420 380h12M1426 374v12"/>
  </g>

  <!-- Garis horizon -->
  <rect x="0" y="1076" width="1920" height="4" fill="#08242c"/>
</svg>
